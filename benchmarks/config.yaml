# =============================================================================
# BACKENDS
# =============================================================================
# Backend entries for wgpu and hip execution.

backends:
  - backend_id: "wgpu"
    wgpu_backends:
      - "Vulkan"
      - "Dx12"
      - "Metal"
    adapter_selection: "auto_high_perf"
    skip: false

  - backend_id: "hip"
    adapter_selection: "auto_high_perf"
    skip: false

# =============================================================================
# SCENARIOS
# =============================================================================
# Definitions of benchmark scenario types and their default parameters.

scenarios:
  decode_only:
    description: "Measure decode throughput in steady-state one-token-per-step mode."
    # Kernel seq_len is always 1; measures repeated infer() calls
    defaults:
      decode_steps: [128, 512, 2048]
      # Optional untimed prime prefill before decode
      prime_prefill_len: 0
      # Whether to sample per-step latencies (adds overhead)
      record_per_step_latency: false

  prefill_uniform:
    description: "Measure prompt processing with uniform prompt lengths across batches."
    # Each batch has the same prompt length L
    defaults:
      # Seq lens defined relative to token_chunk_size C:
      # [1, C/4, C/2, C-1, C, C+1, 2C, 4C, 8C]
      seq_len_pattern: "chunk_relative"
      # Or use explicit list
      seq_lens: [1, 32, 64, 128, 256, 512, 1024, 2048]

  prefill_mixed:
    description: "Measure batching behavior with different prompt lengths per batch element."
    defaults:
      # Named mixed cases - see mixed_cases section for definitions
      mixed_case_ids:
        - "staircase_8"
        - "bimodal_half"
        - "one_long_rest_short"
        - "realistic_chat_scaled"

# Mixed case definitions for prefill_mixed scenario
mixed_cases:
  staircase_8:
    description: "Spread from very short to very long (8 elements)"
    # Pattern relative to C (token_chunk_size):
    # [C/16, C/8, C/4, C/2, 3C/4, C, 2C, 4C]
    base_pattern_divisors: [16, 8, 4, 2, 1.333, 1, 0.5, 0.25]
    adapt_rule: "truncate_or_repeat"

  bimodal_half:
    description: "Two buckets: short (C/8) and long (4C)"
    short_divisor: 8
    long_divisor: 0.25
    # ceil(B/2) long, floor(B/2) short
    distribution: "long_heavy"

  one_long_rest_short:
    description: "One very long prompt (8C), rest short (C/8)"
    long_divisor: 0.125
    short_divisor: 8
    long_count: 1

  realistic_chat_scaled:
    description: "Hand-curated increasing pattern scaled from C=256 base"
    # Base pattern for C=256
    base_lengths: [32, 64, 96, 128, 192, 256, 384, 512]
    base_chunk_size: 256
    # Scale: len_i = max(1, base_i * C / 256)
    scale_rule: "linear"

# =============================================================================
# OUTPUT
# =============================================================================
# JSONL output path configuration.

output:
  # Directory for benchmark results
  directory: "benchmarks/results"

  # File naming pattern
  # Available placeholders: {profile}, {timestamp}, {git_sha}, {run_id}
  filename_pattern: "bench_{profile}_{timestamp}.jsonl"

  # Whether to append to existing file or create new
  mode: "create_new"

  # Enable compression (gzip) for output files
  compress: false

  # Include run header record at start of each output file
  include_run_header: true

  # Pretty-print JSON (one field per line) - disable for smaller files
  pretty_print: false

# =============================================================================
# SKIP CONDITIONS
# =============================================================================
# Rules for skipping cases that would fail or are not meaningful.

skip_conditions:
  # Skip if batch_size exceeds model's max
  skip_batch_exceeds_model_max: true

  # Skip if token_chunk_size exceeds model's max
  skip_chunk_exceeds_model_max: true

  # Skip combinations known to fail (e.g., hip + certain models)
  skip_known_failures: true

  # Skip if estimated memory exceeds available GPU memory
  skip_oom_predicted: true

  # Custom skip rules (evaluated in order)
  custom_rules:
    - name: "skip_large_batch_large_seq"
      description: "Skip batch_size > 16 when seq_len > 1024 (prefill only)"
      condition: "batch_size > 16 AND seq_len IS NOT NULL AND seq_len > 1024"

    - name: "skip_puzzle15_hip"
      description: "Skip puzzle15 model on hip backend (custom ops not supported)"
      condition: "model_name = 'rwkv_puzzle15' AND backend = 'hip'"

    - name: "skip_wgpu_large_batch"
      description: "Skip large batch sizes on wgpu to avoid buffer size limits"
      condition: "backend LIKE 'wgpu%' AND batch_size > 256"

    # --- AIMax 395 VRAM/memory limits ---
    # Decode limits discovered via aimax395_discover_decode profile.
    # Prefill/wgpu limits are placeholders until discovery runs complete.
    # The memory budget (WEB_RWKV_MAX_DEVICE_MB) provides a runtime safety net
    # that catches cases beyond these limits even without exact skip values.
    #
    # HIP decode: per-model max batch_size (discovered)
    - name: "aimax395_hip_decode_0.1b"
      description: "AIMax 395: 0.1b HIP decode max batch=8192"
      condition: "backend = 'hip' AND model_name = 'rwkv7_g1a_0.1b' AND scenario = 'decode_only' AND batch_size > 8192"

    - name: "aimax395_hip_decode_2.9b"
      description: "AIMax 395: 2.9b HIP decode max batch=1024"
      condition: "backend = 'hip' AND model_name = 'rwkv7_g1c_2.9b' AND scenario = 'decode_only' AND batch_size > 1024"

    - name: "aimax395_hip_decode_7.2b"
      description: "AIMax 395: 7.2b HIP decode max batch=512 (from budget estimate)"
      condition: "backend = 'hip' AND model_name = 'rwkv7_g1d_7.2b' AND scenario = 'decode_only' AND batch_size > 512"

    - name: "aimax395_hip_decode_13.3b"
      description: "AIMax 395: 13.3b HIP decode max batch=512"
      condition: "backend = 'hip' AND model_name = 'rwkv7_g0b_13.3b' AND scenario = 'decode_only' AND batch_size > 512"

    # HIP prefill: per-model max batch * chunk product
    - name: "aimax395_hip_prefill_0.1b"
      description: "AIMax 395: 0.1b HIP prefill max batch*chunk"
      condition: "backend = 'hip' AND model_name = 'rwkv7_g1a_0.1b' AND scenario = 'prefill_uniform' AND batch_size * token_chunk_size > 999999999"

    - name: "aimax395_hip_prefill_2.9b"
      description: "AIMax 395: 2.9b HIP prefill max batch*chunk"
      condition: "backend = 'hip' AND model_name = 'rwkv7_g1c_2.9b' AND scenario = 'prefill_uniform' AND batch_size * token_chunk_size > 999999999"

    - name: "aimax395_hip_prefill_7.2b"
      description: "AIMax 395: 7.2b HIP prefill max batch*chunk"
      condition: "backend = 'hip' AND model_name = 'rwkv7_g1d_7.2b' AND scenario = 'prefill_uniform' AND batch_size * token_chunk_size > 999999999"

    - name: "aimax395_hip_prefill_13.3b"
      description: "AIMax 395: 13.3b HIP prefill max batch*chunk"
      condition: "backend = 'hip' AND model_name = 'rwkv7_g0b_13.3b' AND scenario = 'prefill_uniform' AND batch_size * token_chunk_size > 999999999"

    # wgpu: only small models fit in 1 GB VRAM
    - name: "aimax395_wgpu_model_limit"
      description: "AIMax 395: wgpu only supports small models (1 GB VRAM)"
      condition: "backend LIKE 'wgpu%' AND model_name != 'rwkv7_g1a_0.1b' AND model_name != 'rwkv7_othello_9m' AND model_name != 'rwkv_puzzle15'"

    - name: "aimax395_wgpu_decode_limit"
      description: "AIMax 395: wgpu decode max batch (placeholder)"
      condition: "backend LIKE 'wgpu%' AND scenario = 'decode_only' AND batch_size > 999999999"

# =============================================================================
# LIMITS
# =============================================================================
# Global limits for benchmark execution.

limits:
  # Maximum total number of benchmark cases to run
  max_total_cases: 10000

  # Maximum total runtime in seconds (0 = unlimited)
  max_runtime_seconds: 3600

  # Stop on first error vs continue and log errors
  fail_fast: false

  # Maximum errors before aborting (0 = unlimited)
  max_errors: 100

  # Per-case timeout in seconds
  case_timeout_seconds: 300

  # Maximum memory usage threshold (percentage of available GPU memory)
  max_memory_percent: 90

# =============================================================================
# SHARED CONTROLS
# =============================================================================
# Default values for all scenarios (can be overridden per-profile).

shared_controls:
  # Fixed PRNG seed for token generation (ensures reproducibility)
  seed: 42

  # Warmup configuration
  warmup:
    # Number of full repeats not recorded
    warmup_runs: 1
    # Per-repeat warmup steps for decode
    warmup_steps: 64

  # Number of recorded repeats per case
  repeats: 5

  # Timing configuration
  timing:
    # Use Instant::now() around measured loop only
    exclude_model_load: true
    # Device settle delay between repeats (milliseconds)
    settle_delay_ms: 100

  # Error handling policy
  error_policy:
    # Continue on error and write status=error records
    continue_on_error: true
    # Error classification for JSONL records
    classify_errors: true
    # Error kinds: oom, device_lost, unsupported_backend, file_missing, timeout
