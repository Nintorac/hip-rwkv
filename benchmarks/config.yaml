# web-rwkv Benchmark Configuration
# ===================================
# This file defines the benchmark matrix for performance testing.
# All benchmark parameters are config-driven; code only understands scenario types,
# how to execute them, and how to write JSONL output.

# Schema version - bump on breaking changes
schema_version: 3

# =============================================================================
# PROFILES
# =============================================================================
# Named presets that reference model/backend lists and scenario params.
# Use `WEB_RWKV_BENCH_PROFILE` env var to select (default: smoke).

profiles:
  smoke:
    description: "Quick sanity check (<1 min). Uses minimal parameters for fast iteration."
    models:
      - rwkv7_othello_9m
    backends:
      - wgpu
    warmup_runs: 1
    repeats: 2
    benchmarks:
      decode_only:
        batch_sizes: [1, 4]
        decode_steps: [128]
      prefill_uniform:
        batch_sizes: [1, 4]
        token_chunk_sizes: [128]
        seq_lens: [32, 128, 256]

  dev:
    description: "Development profile (~5-10 min). Broader coverage for local testing."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
    backends:
      - hip
      - wgpu
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [16, 32]
        decode_steps: [32, 64]
      prefill_uniform:
        batch_sizes: [16, 32]
        token_chunk_sizes: [32]
        seq_lens: [32, 64]
      prefill_mixed:
        batch_sizes: [16, 32]
        token_chunk_sizes: [32]
        seq_lens: [32, 64]

  quick_coverage:
    description: "Quick coverage profile (~3-6 min). Good dashboard axes with limited runtime."
    models:
      - rwkv7_g1a_0.1b
    backends:
      - hip
      - wgpu
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [8, 16]
        decode_steps: [64]
      prefill_uniform:
        batch_sizes: [8, 16]
        token_chunk_sizes: [32, 64]
        seq_lens: [32, 64]
      prefill_mixed:
        batch_sizes: [8, 16]
        token_chunk_sizes: [32, 64]
        seq_lens: [32, 64]

  decode_batch_sweep:
    description: "Decode-only batch sweep (fast). Single-step decode across large batch sizes."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
    backends:
      - wgpu
      - hip
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        # batch_sizes: [32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
        batch_sizes: [32, 64, 128, 256]
        decode_steps: [8]

  ablation_all_sizes:
    description: "Ablation across all model sizes (0.1b, 2.9b, 13.3b)."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
      - rwkv7_g0b_13.3b
    backends:
      - wgpu
      - hip
    warmup_runs: 1
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [1, 8, 32, 64, 128]
        decode_steps: [16]

  ablation_quick:
    description: "Quick ablation for HIP optimizations (0.1b and 2.9b, HIP only)."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
    backends:
      - hip
    warmup_runs: 1
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [64, 256]
        decode_steps: [8]

  decode_batch_sweep_hip:
    description: "Decode-only batch sweep (fast, hip only)."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
    backends:
      - hip
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        # batch_sizes: [32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
        batch_sizes: [32, 64, 128, 256, 512, 1024]
        decode_steps: [64]

  decode_batch_sweep_hip_large:
    description: "Decode-only batch sweep (hip only, large batches)."
    models:
      - rwkv7_g1a_0.1b
      # - rwkv7_g1c_2.9b
    backends:
      - hip
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [512, 1024, 2048, 4096, 8192, 16384, 32768]
        decode_steps: [64]

  prefill_chunk_sweep:
    description: "Prefill sweep across chunk sizes 16/64/256/1024 with uniform and mixed scenarios."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
    backends:
      - hip
    warmup_runs: 1
    repeats: 1
    benchmarks:
      prefill_uniform:
        batch_sizes: [1, 4, 16]
        token_chunk_sizes: [16, 64, 256, 1024]
        seq_lens: [1, 8, 32, 64, 128, 256, 512, 1024, 2048]
      prefill_mixed:
        batch_sizes: [1, 4, 16]
        token_chunk_sizes: [16, 64, 256, 1024]
        seq_lens: [1, 8, 32, 64, 128, 256, 512, 1024, 2048]

  prefill_chunk_sweep_quick:
    description: "Quick prefill chunk sweep (0.1b only, bs=1)."
    models:
      - rwkv7_g1a_0.1b
    backends:
      - hip
    warmup_runs: 0
    repeats: 1
    benchmarks:
      prefill_uniform:
        batch_sizes: [1]
        token_chunk_sizes: [16, 64, 256, 1024]
        seq_lens: [1, 32, 256, 1024]

  prefill_single_chunk:
    description: "Single-chunk prefill throughput at various chunk sizes (seq_len == chunk_size)."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
      - rwkv7_g1d_7.2b
      - rwkv7_g0b_13.3b
    backends:
      - hip
    warmup_runs: 1
    repeats: 1
    benchmarks:
      prefill_uniform:
        batch_sizes: [8, 16]
        token_chunk_sizes: [64, 128, 256, 512, 1024, 2048, 4096]
        seq_lens: [64, 128, 256, 512, 1024, 2048, 4096]

  decode_dev:
    description: "Decode-only dev loop (very fast). 0.1b only, small batch sweep."
    models:
      - rwkv7_g1a_0.1b
    backends:
      - hip
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [32, 64, 128, 256]
        decode_steps: [4]

  full:
    description: "Full benchmark suite (~30+ min). Comprehensive coverage for CI/nightly."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
    backends:
      - wgpu
      - hip
    warmup_runs: 2
    repeats: 5
    benchmarks:
      decode_only:
        batch_sizes: [1, 2, 4, 8, 16, 32]
        decode_steps: [128, 512, 2048]
      prefill_uniform:
        batch_sizes: [1, 2, 4, 8, 16, 32]
        token_chunk_sizes: [32, 128, 256, 512]
        seq_lens: [1, 8, 32, 64, 127, 128, 129, 256, 512, 1024, 2048]
      prefill_mixed:
        batch_sizes: [1, 2, 4, 8, 16, 32]
        token_chunk_sizes: [32, 128, 256, 512]
        seq_lens: [1, 8, 32, 64, 127, 128, 129, 256, 512, 1024, 2048]

  # =========================================================================
  # AIMax 395 Discovery & Dashboard Profiles
  # =========================================================================
  # Discovery profiles: minimal overhead, broad parameter sweep to find limits.
  # Set WEB_RWKV_MAX_DEVICE_MB=32768 to prevent GTT overflow on the APU.

  aimax395_discover_decode:
    description: "Discover max HIP decode batch_size per model on AIMax 395."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
      - rwkv7_g1d_7.2b
      - rwkv7_g0b_13.3b
    backends:
      - hip
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
        decode_steps: [4]

  aimax395_discover_prefill:
    description: "Discover max HIP prefill batch*chunk per model on AIMax 395."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
      - rwkv7_g1d_7.2b
      - rwkv7_g0b_13.3b
    backends:
      - hip
    warmup_runs: 0
    repeats: 1
    benchmarks:
      prefill_uniform:
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
        token_chunk_sizes: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
        seq_lens: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]

  aimax395_discover_wgpu:
    description: "Discover max wgpu decode batch_size on AIMax 395."
    models:
      - rwkv7_g1a_0.1b
    backends:
      - wgpu
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
        decode_steps: [4]

  aimax395_dashboard:
    description: "AIMax 395 dashboard benchmark. Power-of-2 decode/prefill sweeps, all models."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
      - rwkv7_g1d_7.2b
      - rwkv7_g0b_13.3b
    backends:
      - hip
      - wgpu
    warmup_runs: 1
    repeats: 3
    benchmarks:
      decode_only:
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
        decode_steps: [32]
      prefill_uniform:
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
        token_chunk_sizes: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
        seq_lens: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]

  aimax395_dashboard_validate:
    description: "AIMax 395 dashboard validation (single run, no warmup)."
    models:
      - rwkv7_g1a_0.1b
      - rwkv7_g1c_2.9b
      - rwkv7_g1d_7.2b
      - rwkv7_g0b_13.3b
    backends:
      - hip
      - wgpu
    warmup_runs: 0
    repeats: 1
    benchmarks:
      decode_only:
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096, 8192, 16384, 32768]
        decode_steps: [32]
      prefill_uniform:
        batch_sizes: [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
        token_chunk_sizes: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
        seq_lens: [16, 32, 64, 128, 256, 512, 1024, 2048, 4096]

