[workspace]
members = [".", "crates/rwkv-bench"]

[workspace.package]
authors = ["Zhenyuan Zhang <cryscan@umich.edu>"]
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.83.0"

[workspace.dependencies]
serde = "1.0"

[package]
name = "hip-rwkv"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
description = "HIP/ROCm backend for RWKV language models"

[dependencies]
web-rwkv = { version = "0.10.19", default-features = false }
half = { version = "2.7", features = ["bytemuck", "serde"] }
bytemuck = { version = "1.24", features = ["extern_crate_alloc"] }
safetensors = "0.6"
memmap2 = "0.9"
futures = "0.3"
log = "0.4"

[dev-dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fastrand = "2.3"
half = { version = "2.7", features = ["bytemuck", "serde"] }
memmap2 = "0.9"
npyz = { version = "0.8.4", features = ["half", "npz"] }
safetensors = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
test-case = "3.3.1"
tokio = { version = "1.41", features = ["full"] }
web-rwkv = { version = "0.10.19", features = ["native"] }
wgpu = "28.0"
rwkv-bench = { path = "crates/rwkv-bench" }

[features]
default = []
hip-probes = []
