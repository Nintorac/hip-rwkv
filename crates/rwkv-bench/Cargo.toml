[package]
name = "rwkv-bench"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
description = "Benchmarking utilities for RWKV"
license.workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
regex = "1.12"
sha2 = "0.10"
duckdb = { version = "1.1.1", features = ["bundled", "appender-arrow"] }
